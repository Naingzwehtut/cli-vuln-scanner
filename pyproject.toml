[project]
name = "web-vulnerability-scanner"
version = "0.1.0"
description = "CLI web application vulnerability scanner for authorized security testing"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27.2",
    "beautifulsoup4>=4.12.3",
    "typer>=0.12.5",
    "rich>=13.8.1",
    "pydantic>=2.9.2",
    "SQLAlchemy>=2.0.35",
    "cryptography>=43.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
]

[project.scripts]
scanner = "scanner.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scanner*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
